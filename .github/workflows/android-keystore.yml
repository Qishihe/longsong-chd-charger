name: 安卓 · 生成签名密钥（只需跑一次）

# 为什么要单独一条：Android 用签名判断"是不是同一个 App"。
# 换一把钥匙 → 新包装不上去覆盖旧包，用户必须先卸载（偏好、登录状态全丢）。
# 所以钥匙要固定，而且只能生成一次、长期备份。
#
# 用法：
#   1. 仓库 Settings › Secrets and variables › Actions 新建 KEYSTORE_PASSWORD（自己定，记牢）
#   2. 可选再建 KEY_ALIAS（不建则用 chdcharge）
#   3. Actions 里跑这条，输入 GENERATE 确认
#   4. 跑完在 Summary 页复制那串 base64 → 建 KEYSTORE_BASE64 secret
#   5. 删掉这次运行的 artifact

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 GENERATE 确认生成（会覆盖同名的旧密钥，务必只跑一次）'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  keystore:
    if: github.event.inputs.confirm == 'GENERATE'
    runs-on: ubuntu-latest
    steps:
      - name: 检查口令 secret 是否已建
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::缺少 KEYSTORE_PASSWORD。请先在 Settings › Secrets and variables › Actions 里新建它。"
            exit 1
          fi
          echo "口令已就绪（长度 ${#KS_PASS}）"

      - name: 生成 RSA 2048 密钥（有效期 10000 天 ≈ 27 年）
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ALIAS="${KEY_ALIAS:-chdcharge}"
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Changge, OU=Mobile, O=chd-charge, L=Xian, ST=Shaanxi, C=CN"
          echo "ALIAS=$ALIAS" >> "$GITHUB_ENV"

      - name: 输出指纹与 base64 到运行摘要
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          {
            echo "## 签名密钥已生成"
            echo ""
            echo "### 1. 先记下指纹"
            echo '以后怀疑"这把钥匙还是不是原来那把"，看这里就行 —— 两次指纹一致就说明没变。'
            echo '```'
            keytool -list -v -keystore release.keystore -alias "$ALIAS" -storepass "$KS_PASS" \
              | grep -E "SHA1:|SHA256:"
            echo '```'
            echo ""
            echo "### 2. 复制下面整段，存成 Secret：KEYSTORE_BASE64"
            echo '```'
            base64 -w0 release.keystore
            echo ""
            echo '```'
            echo ""
            echo "### 3. 收尾"
            echo "把 keystore 文件自己另存一份（U 盘 / 密码管理器）。**丢了就再也发不出能覆盖升级的包。**"
            echo "确认 secret 存好之后，删掉这次运行的 artifact。"
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 keystore 备份（1 天后自动过期）
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-backup
          path: release.keystore
          retention-days: 1
          if-no-files-found: error
