org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ── App 版本（每次要发新 APK 时把 CODE +1，Android 靠它判断"谁更新"） ──
# CI 会覆盖成 GitHub run_number，天然递增，不用手改。
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0.0

# ── 入口地址 ──
# 换域名必须改这两行并重新出 APK：App 里没有网页资源，只认这个 URL。
APP_URL=https://chd-charge.app.workbuddy.host/
APP_HOST=chd-charge.app.workbuddy.host
