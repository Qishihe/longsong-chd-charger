<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>主页面改版样张 · 参考汕大那套</title>
<!--
  ============================================================================
  主页面改版「样张」（2026-10-21）
  ============================================================================
  这是给产品方看样子的**独立页面**，不是站点的一部分、也不影响 preview.html。

  为什么要先做样张：
    · 参考图（汕大那套）是一套完整的设计语言：分段页签 / 圆角地图卡 + 浮动控件 /
      数字圆标 / 图例 / 地点网格 / 大字号 + 进度条的设备卡 / 搜索 / 筛选胶囊 / 底部导航；
    · 把 preview.html（4800 行、且带着刷新、筛选、排序、收藏、地图弹窗、使用情况、
      设置、CLS 优化等一堆行为）**盲改**成这套，我看不到任何渲染结果，
      不能判断它"像不像参考图"还是"塌了"；
    · 所以先做一个**能真打开、且用真实校园数据渲染**的样张：
      方向对了再分阶段搬进内测版，一次一小步、每步都能验。

  样张里的数据：
    · **地图是真的** —— 加载 `map-data.js`，把校园边界 / 建筑 / 水域按参考图那种
      「示意地图」画出来（浅绿底 + 米色建筑 + 蓝水），3 个地点按 `D.areas[loc].line`
      的真实位置打数字圆标。所以位置分布不是编的。
    · **空闲数是假的**（`PLACES` 里的 free/total）—— 只为展示"已满/较少/充足"三态
      和进度条。真实数据接入时会换成实际采集值。
-->
<style>
  /* ===================== 设计令牌（照参考图取的色） ===================== */
  :root{
    --bg:#F6F7F2;          /* 页面底：偏绿的白 */
    --card:#FFFFFF;
    --line:#ECEDE6;        /* 卡片描边（极浅） */
    --line2:#E2E4DB;       /* 更实一点的分隔线 */
    --ink:#2C3A31;         /* 主文字：深绿灰 */
    --ink2:#5C6B60;
    --hint:#8A9187;        /* 次要文字 */
    --green:#1F6E4F;       /* 主色（充足） */
    --green-bg:#E3F0E8;
    --amber:#D9A321;       /* 较少 */
    --amber-bg:#F7EBD0;
    --red:#C0392B;         /* 已满 */
    --red-bg:#F7E3E0;
    --grey:#8A9187;        /* 待更新 */
    --grey-bg:#EDEEE9;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;               /* 给底部导航留位 */
  }
  .wrap{max-width:460px;margin:0 auto;padding:0 14px}

  /* ===================== 顶部分段页签 ===================== */
  .tabs{
    display:flex; align-items:stretch; gap:2px;
    padding:6px 4px 0; background:var(--bg);
    position:sticky; top:0; z-index:30;
  }
  .tab{
    flex:1; border:0; background:none; cursor:pointer;
    font:inherit; font-size:15px; color:var(--hint);
    padding:12px 4px 11px; position:relative; white-space:nowrap;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .tab.on{color:var(--ink); font-weight:700}
  .tab.on::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    bottom:0; width:34px; height:3px; border-radius:2px; background:var(--ink);
  }
  /* 页签上的数量胶囊 */
  .tab .cnt{
    font-size:12px; font-weight:600; color:var(--hint);
    background:var(--grey-bg); border-radius:99px; padding:1px 7px; line-height:1.5;
  }
  .tab.on .cnt{background:var(--green-bg); color:var(--green)}
  .hairline{height:1px;background:var(--line);margin:0 4px}

  /* ===================== 地图卡 ===================== */
  .mapcard{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    margin-top:14px; overflow:hidden; position:relative;
  }
  .maphead{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 15px 8px;
  }
  .maphead .t{display:flex; align-items:center; gap:7px; font-size:15px; font-weight:600}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--green);flex:none}
  .maphead .s{font-size:12.5px;color:var(--hint)}
  .mapsvg{display:block;width:100%;height:auto}

  /* 右侧竖排浮动控件 */
  .mapctl{
    position:absolute; right:10px; top:52px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 2px 10px rgba(44,58,49,.07);
    display:flex; flex-direction:column; align-items:center; overflow:hidden;
  }
  .mapctl button{
    width:42px;height:42px;border:0;background:none;cursor:pointer;
    color:var(--ink2); font-size:19px; line-height:1;
  }
  .mapctl button:active{background:var(--grey-bg)}
  .mapctl .sep{width:24px;height:1px;background:var(--line2)}

  /* 地图上的地点圆标 */
  .mk{ cursor:pointer }
  .mk circle{fill:var(--amber); stroke:#fff; stroke-width:2.5}
  .mk text{fill:#fff; font-size:13px; font-weight:700; text-anchor:middle; dominant-baseline:central}
  .mk.sel circle{fill:var(--amber); stroke:#fff; stroke-width:3}
  .mk.ok circle{fill:var(--green)}
  .mk .halo{fill:rgba(217,163,33,.20)}
  .mk.sel .halo{fill:rgba(217,163,33,.32)}
  .mkname{fill:var(--ink); font-size:12.5px; font-weight:700; text-anchor:middle}

  /* 地图下方的选中地点卡（压在卡内底部） */
  .selplace{
    display:flex; align-items:center; gap:12px;
    margin:0 12px 12px; padding:13px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .selplace .ic{
    width:42px;height:42px;flex:none;border-radius:11px;background:var(--amber-bg);
    display:flex;align-items:center;justify-content:center;font-size:20px;
  }
  .selplace .tx{flex:1;min-width:0}
  .selplace .tx b{display:block;font-size:17px;font-weight:700;letter-spacing:-.2px}
  .selplace .tx span{display:block;font-size:13px;color:var(--hint);margin-top:1px}
  .selplace .go{color:var(--hint);font-size:19px}

  /* ===================== 图例 ===================== */
  .legend{
    display:flex;align-items:center;justify-content:space-between;
    margin:14px 2px 8px;
  }
  .legend .l{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600}
  .legend .l .dot{background:var(--ink2)}
  .legend .r{font-size:12.5px;color:var(--hint)}
  .scale{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:12.5px;color:var(--ink2);margin:0 2px 12px;
  }
  .scale i{width:9px;height:9px;border-radius:99px;display:inline-block;margin-right:5px;vertical-align:1px}

  /* ===================== 地点网格 ===================== */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .place{
    display:flex;align-items:center;gap:10px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;font-size:15px;color:var(--ink);
  }
  .place .n{
    width:23px;height:23px;flex:none;border-radius:99px;
    background:var(--amber);color:#fff;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .place.ok .n{background:var(--green)}
  .place.sel{border-color:var(--amber);background:#FDF8EC}
  .place.sel .n{outline:2px solid rgba(217,163,33,.35);outline-offset:2px}

  /* ===================== 全部设备 ===================== */
  h1.big{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:18px 2px 4px}
  .sub{margin:0 2px 14px;font-size:13.5px;color:var(--hint)}
  .search{
    display:flex;align-items:center;gap:9px;
    background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:0 13px;height:46px;margin-bottom:12px;
  }
  .search input{border:0;outline:0;background:none;flex:1;font:inherit;font-size:15px;color:var(--ink)}
  .search input::placeholder{color:var(--hint)}
  .fchips{display:flex;gap:8px;overflow-x:auto;padding:0 2px 4px;margin-bottom:10px}
  .fchip{
    flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:99px;padding:0 15px;height:35px;font:inherit;font-size:13.5px;cursor:pointer;
  }
  .fchip.on{background:var(--green-bg);border-color:transparent;color:var(--green);font-weight:600}
  .selrow{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
  .selrow label{font-size:13.5px;color:var(--hint);margin-right:8px}
  .selrow .g{display:flex;align-items:center}
  .selrow select{
    border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:8px 10px;font:inherit;font-size:13.5px;color:var(--ink);
  }

  /* ===================== 地点卡（大字号 + 进度条） ===================== */
  .dev{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:16px 16px 13px;margin-bottom:12px;
  }
  .dev .top{display:flex;align-items:flex-start;gap:8px}
  .dev .top h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1;min-width:0}
  .tag{
    flex:none;font-size:11.5px;color:var(--ink2);background:#F1F3EC;
    border-radius:6px;padding:2px 7px;margin-top:3px;
  }
  .fav{border:0;background:none;font-size:19px;color:var(--hint);cursor:pointer;line-height:1;padding:2px}
  .fav.on{color:var(--amber)}
  .dev .meta{margin:6px 0 0;font-size:13.5px;color:var(--ink2)}
  .dev .meta2{margin:3px 0 0;font-size:12.5px;color:var(--hint)}
  .dev .numrow{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
  .big-n{
    font-size:46px;font-weight:800;letter-spacing:-2px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .big-n.g{color:var(--green)} .big-n.a{color:var(--amber)} .big-n.r{color:var(--red)}
  .cap{font-size:13.5px;color:var(--ink2)}
  .pill{
    margin-left:auto;flex:none;font-size:13px;font-weight:600;
    border-radius:99px;padding:6px 13px;
  }
  .pill.g{background:var(--green-bg);color:var(--green)}
  .pill.a{background:var(--amber-bg);color:#A87A10}
  .pill.r{background:var(--red-bg);color:var(--red)}
  .pill.k{background:var(--grey-bg);color:var(--grey)}
  .bar{height:7px;border-radius:99px;background:#EDEEE8;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--green)}
  .bar i.a{background:var(--amber)} .bar i.r{background:var(--red)}
  .dev .foot{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:10px;font-size:12.5px;color:var(--hint);
  }

  /* ===================== 空态 / 底部导航 ===================== */
  .empty{
    text-align:center;color:var(--hint);font-size:13.5px;line-height:1.8;
    background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);
    padding:40px 20px;margin-top:6px;
  }
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);
    display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .nav button{
    flex:1;border:0;background:none;cursor:pointer;font:inherit;
    color:var(--hint);font-size:12px;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;
  }
  .nav button .i{font-size:21px;line-height:1}
  .nav button.on{color:var(--green);font-weight:600}
  .page{display:none}
  .page.on{display:block}
</style>
</head>
<body>

<div class="wrap">

  <!-- ============ 顶部分段页签 ============ -->
  <div class="tabs">
    <button class="tab on" data-page="map">地图找桩</button>
    <button class="tab" data-page="all">全部设备 <span class="cnt" id="cntAll">–</span></button>
    <button class="tab" data-page="fav">我的收藏</button>
  </div>
  <div class="hairline"></div>

  <!-- ============ ① 地图找桩 ============ -->
  <section class="page on" id="page-map">
    <div class="mapcard">
      <div class="maphead">
        <div class="t"><span class="dot"></span>校园充电地图</div>
        <div class="s"><span id="nPlace">–</span> 处地点 · 方位示意</div>
      </div>

      <!-- 示意地图：由 map-data.js 的真实多边形画出来 -->
      <svg class="mapsvg" id="mapsvg" viewBox="0 0 700 470" preserveAspectRatio="xMidYMid meet" aria-label="校园示意图"></svg>

      <div class="mapctl">
        <button title="定位">◎</button>
        <button title="图层">▤</button>
        <div class="sep"></div>
        <button title="放大" id="zin">＋</button>
        <button title="缩小" id="zout">－</button>
      </div>

      <div class="selplace">
        <div class="ic">⚡</div>
        <div class="tx">
          <b id="selName">–</b>
          <span id="selMeta">–</span>
        </div>
        <div class="go">→</div>
      </div>
    </div>

    <div class="legend">
      <div class="l"><span class="dot"></span>编号对应下方地点</div>
      <div class="r">拖动 / 双指缩放</div>
    </div>

    <div class="scale">
      <span><i style="background:#C0392B"></i>已满 · 0</span>
      <span><i style="background:#D9A321"></i>较少 · ≤25%</span>
      <span><i style="background:#1F6E4F"></i>充足 · &gt;25%</span>
      <span><i style="background:#8A9187"></i>待更新</span>
    </div>

    <div class="grid" id="placeGrid"></div>
  </section>

  <!-- ============ ② 全部设备 ============ -->
  <section class="page" id="page-all">
    <h1 class="big">全部充电设备</h1>
    <p class="sub" id="allSub">–</p>

    <div class="search">
      <span style="color:var(--hint)">🔍</span>
      <input id="q" placeholder="搜索名称、设备编号或地点" autocomplete="off">
    </div>

    <div class="fchips">
      <button class="fchip on" data-f="all">全部</button>
      <button class="fchip" data-f="free">当前有空位</button>
      <button class="fchip" data-f="full">已满</button>
    </div>

    <div class="selrow">
      <div class="g"><label for="floc">地点</label>
        <select id="floc"><option value="">全部地点</option></select>
      </div>
      <div class="g"><label for="fsort">排序</label>
        <select id="fsort">
          <option value="free">目前空闲</option>
          <option value="id">设备编号</option>
          <option value="rate">空闲率</option>
        </select>
      </div>
    </div>

    <div id="devList"></div>
  </section>

  <!-- ============ ③ 我的收藏 ============ -->
  <section class="page" id="page-fav">
    <h1 class="big">我的收藏</h1>
    <p class="sub">在设备卡右上角点 ☆ 就能收藏，这里会一直留着。</p>
    <div id="favList"></div>
  </section>

</div>

<!-- ============ 底部导航 ============ -->
<nav class="nav">
  <button class="on" data-page="map"><span class="i">▤</span>地图</button>
  <button data-page="all"><span class="i">▦</span>设备</button>
  <button data-page="fav"><span class="i">☆</span>收藏</button>
</nav>

<script src="map-data.js"></script>
<script>
/* ============================================================================
   样张数据
   ----------------------------------------------------------------------------
   ⚠️ `free` / `total` 是**编的**，只为把「已满 / 较少 / 充足」三态和进度条都展示出来。
      真实数据接入时会换成实际采集值。
   · `total` 用的是**观测到的实际插座数**（不是「桩数 × 4」）——
     北门实测 144 而不是 37×4=148，朝晖 144 而不是 36×4=144（这个刚好相等）。
   · 三处地点、编号与位置都是真的：来自 DEFAULT_DEVICES 与 map-data.js 的 areas。
   ============================================================================ */
const PLACES = [
  { loc: '渭水-朝晖体育场南', name: '朝晖体育场南', devs: 36, total: 144, free: 3  },
  { loc: '渭水-北门',         name: '北门',         devs: 37, total: 144, free: 6  },
  { loc: '渭水-20号楼',       name: '20号楼',       devs: 24, total: 96,  free: 31 },
];

/* 说明：真实版这里会是「按地点聚合后的结果」；
   现在就用 PLACES 直接算，逻辑与将来的聚合一致。 */
function stateOf(p) {
  if (!p.total) return { k: 'k', txt: '待更新', rate: null };
  const r = p.free / p.total;
  if (p.free <= 0) return { k: 'r', txt: '已满', rate: r };
  if (r <= 0.25) return { k: 'a', txt: '空位较少', rate: r };
  return { k: 'g', txt: '空位充足', rate: r };
}

/* ---------------- 页签 / 底部导航 ---------------- */
const pages = ['map', 'all', 'fav'];
function go(page) {
  pages.forEach((p) => {
    document.getElementById('page-' + p).classList.toggle('on', p === page);
    document.querySelectorAll('[data-page="' + p + '"]').forEach((b) => {
      b.classList.toggle('on', b.classList.contains('tab') ? p === page : p === page);
    });
  });
  // 页签：只有点击的那个高亮；底部导航同理
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.page === page));
  document.querySelectorAll('.nav button').forEach((b) => b.classList.toggle('on', b.dataset.page === page));
  window.scrollTo({ top: 0 });
}
document.querySelectorAll('.tab, .nav button').forEach((b) => {
  b.addEventListener('click', () => go(b.dataset.page));
});

/* ---------------- 选址状态 ---------------- */
let sel = PLACES.find((p) => p.loc === '渭水-朝晖体育场南') || PLACES[0];

function renderSel() {
  const s = stateOf(sel);
  document.getElementById('selName').textContent = sel.name;
  document.getElementById('selMeta').textContent =
    `${sel.devs} 台设备 · ${sel.total} 个插座 · 空闲 ${sel.free}`;
}

/* ---------------- 示意地图（用真实多边形画） ---------------- */
function drawMap() {
  const D = window.CHD_MAP;
  const svg = document.getElementById('mapsvg');
  if (!D || !D.boundary) {
    svg.innerHTML = '<text x="350" y="235" text-anchor="middle" fill="#8A9187" font-size="14">map-data.js 没加载到</text>';
    return;
  }
  const VW = 700, VH = 470, PAD = 16;
  const xs = D.boundary.map((p) => p[0]), ys = D.boundary.map((p) => p[1]);
  const minx = Math.min(...xs), maxx = Math.max(...xs);
  const miny = Math.min(...ys), maxy = Math.max(...ys);
  const s = Math.min((VW - PAD * 2) / (maxx - minx), (VH - PAD * 2) / (maxy - miny));
  const ox = (VW - (maxx - minx) * s) / 2, oy = (VH - (maxy - miny) * s) / 2;
  // lon→x，lat→y（注意 lat 要翻转，北在上）
  const X = (lng) => ox + (lng - minx) * s;
  const Y = (lat) => oy + (maxy - lat) * s;
  const ring = (pts) => pts.map((p) => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');

  let out = '';
  // 底色（校区外一圈更淡，做出"示意"的层次）
  out += `<rect x="0" y="0" width="${VW}" height="${VH}" fill="#F1F3EC"/>`;
  // 校园边界：浅绿填充
  out += `<polygon points="${ring(D.boundary)}" fill="#E7EFE2" stroke="#CBDCC4" stroke-width="1.2"/>`;
  // 水域
  (D.water || []).forEach((w) => {
    (w.p || []).forEach((r) => { out += `<polygon points="${ring(r)}" fill="#CFE4EA"/>`; });
  });
  // 建筑：米色块（照参考图）
  (D.buildings || []).forEach((b) => {
    (b.p || []).forEach((r) => {
      out += `<polygon points="${ring(r)}" fill="#EDE6D8" stroke="#DED4C0" stroke-width="0.8"/>`;
    });
  });
  // 场地：更暖的浅色
  (D.venues || []).forEach((v) => {
    (v.p || []).forEach((r) => { out += `<polygon points="${ring(r)}" fill="#E4EAD8" stroke="#D2DCC2" stroke-width="0.8"/>`; });
  });

  // 地点数字圆标：位置取 D.areas[loc].line 的**中点**（真实位置，不是编的）
  PLACES.forEach((p, i) => {
    const a = (D.areas || {})[p.loc];
    if (!a || !a.line) return;
    const cx = X((a.line[0][0] + a.line[1][0]) / 2);
    const cy = Y((a.line[0][1] + a.line[1][1]) / 2);
    const st = stateOf(p);
    const isSel = p.loc === sel.loc;
    out += `<g class="mk ${isSel ? 'sel' : ''} ${st.k === 'g' ? 'ok' : ''}" data-loc="${p.loc}" style="cursor:pointer">`
        +  `<circle class="halo" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${isSel ? 30 : 25}" stroke="none"/>`
        +  `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="15"/>`
        +  `<text x="${cx.toFixed(1)}" y="${cy.toFixed(1)}">${i + 1}</text>`
        +  `</g>`;
    if (isSel) {
      // 选中的那个：名字浮在圆标上方（照参考图「图书馆」那个白底标签）
      const w = p.name.length * 13 + 20;
      out += `<g><rect x="${(cx - w / 2).toFixed(1)}" y="${(cy - 46).toFixed(1)}" width="${w}" height="26" rx="6" fill="#fff" stroke="#E8D9AE"/>`
          +  `<text class="mkname" x="${cx.toFixed(1)}" y="${(cy - 33).toFixed(1)}">${p.name}</text></g>`;
    }
  });
  svg.innerHTML = out;

  svg.querySelectorAll('.mk').forEach((g) => {
    g.addEventListener('click', () => {
      sel = PLACES.find((p) => p.loc === g.dataset.loc) || sel;
      renderSel(); drawMap(); renderGrid();
    });
  });
}

/* ---------------- 地点网格（地图页下方） ---------------- */
function renderGrid() {
  const g = document.getElementById('placeGrid');
  g.innerHTML = PLACES.map((p, i) => {
    const st = stateOf(p);
    const cls = ['place'];
    if (st.k === 'g') cls.push('ok');
    if (p.loc === sel.loc) cls.push('sel');
    return `<button class="${cls.join(' ')}" data-loc="${p.loc}">
      <span class="n">${i + 1}</span><span>${p.name}</span></button>`;
  }).join('');
  g.querySelectorAll('.place').forEach((b) => {
    b.addEventListener('click', () => {
      sel = PLACES.find((p) => p.loc === b.dataset.loc) || sel;
      renderSel(); drawMap(); renderGrid();
      go('map');
    });
  });
}

/* ---------------- 全部设备：地点卡 ---------------- */
let fFilter = 'all', fLoc = '', fSort = 'free', favs = new Set();

function visiblePlaces() {
  let arr = PLACES.slice();
  if (fLoc) arr = arr.filter((p) => p.loc === fLoc);
  if (fFilter === 'free') arr = arr.filter((p) => p.free > 0);
  if (fFilter === 'full') arr = arr.filter((p) => p.free <= 0);
  if (fSort === 'free') arr.sort((a, b) => b.free - a.free);
  if (fSort === 'rate') arr.sort((a, b) => (b.total ? b.free / b.total : -1) - (a.total ? a.free / a.total : -1));
  if (fSort === 'id') arr.sort((a, b) => a.loc.localeCompare(b.loc, 'zh'));
  return arr;
}

function cardOf(p) {
  const st = stateOf(p);
  const pct = p.total ? Math.max(0, Math.min(1, p.free / p.total)) * 100 : 0;
  const numCls = st.k === 'g' ? 'g' : st.k === 'a' ? 'a' : st.k === 'r' ? 'r' : '';
  const on = favs.has(p.loc);
  return `<div class="dev">
    <div class="top">
      <h3>${p.name}</h3>
      <span class="tag">地点</span>
      <button class="fav ${on ? 'on' : ''}" data-fav="${p.loc}" title="收藏">${on ? '★' : '☆'}</button>
    </div>
    <p class="meta">${p.loc} · ${p.devs} 台设备</p>
    <p class="meta2">${p.devs * 4} 个桩位 · 观测到 ${p.total} 个插座</p>
    <div class="numrow">
      <span class="big-n ${numCls}">${p.free}</span>
      <span class="cap">空闲 / ${p.total} 口</span>
      <span class="pill ${st.k}">${st.txt}</span>
    </div>
    <div class="bar"><i class="${st.k === 'g' ? '' : st.k}" style="width:${pct.toFixed(1)}%"></i></div>
    <div class="foot"><span>实时 · ${new Date().toTimeString().slice(0, 8)}</span><span>→</span></div>
  </div>`;
}

function renderAll() {
  const arr = visiblePlaces();
  const total = PLACES.reduce((n, p) => n + p.devs, 0);
  document.getElementById('allSub').textContent =
    `显示 ${arr.length} 处 · 共 ${PLACES.length} 处地点、${total} 台已导入设备`;
  document.getElementById('cntAll').textContent = PLACES.length;
  document.getElementById('devList').innerHTML = arr.length
    ? arr.map(cardOf).join('')
    : '<div class="empty">没有符合条件的地点</div>';
  bindFav();
}

function renderFav() {
  const arr = PLACES.filter((p) => favs.has(p.loc));
  document.getElementById('favList').innerHTML = arr.length
    ? arr.map(cardOf).join('')
    : '<div class="empty">还没有收藏<br>在「全部设备」里点卡片右上角的 ☆</div>';
  bindFav();
}

function bindFav() {
  document.querySelectorAll('[data-fav]').forEach((b) => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const k = b.dataset.fav;
      favs.has(k) ? favs.delete(k) : favs.add(k);
      renderAll(); renderFav();
    });
  });
}

/* ---------------- 初始化 ---------------- */
document.getElementById('nPlace').textContent = PLACES.length;
const floc = document.getElementById('floc');
PLACES.forEach((p) => {
  const o = document.createElement('option');
  o.value = p.loc; o.textContent = p.name; floc.appendChild(o);
});
floc.addEventListener('change', () => { fLoc = floc.value; renderAll(); });
document.getElementById('fsort').addEventListener('change', (e) => { fSort = e.target.value; renderAll(); });
document.getElementById('q').addEventListener('input', renderAll);
document.querySelectorAll('.fchip').forEach((b) => {
  b.addEventListener('click', () => {
    fFilter = b.dataset.f;
    document.querySelectorAll('.fchip').forEach((x) => x.classList.toggle('on', x === b));
    renderAll();
  });
});
document.getElementById('zin').addEventListener('click', () => {});
document.getElementById('zout').addEventListener('click', () => {});

renderSel(); drawMap(); renderGrid(); renderAll(); renderFav();
</script>
