# 快照站 · 调度 Worker 的部署配置
#
# 部署前要改两处：
#   1. account_id —— 在 CF Dashboard 右下角 / `npx wrangler whoami` 里拿
#   2. database_id —— `npx wrangler d1 create chd-snap` 输出的 id（见下方注释）
#
# 命令：
#   npx wrangler d1 create chd-snap        # 建库，拿到 database_id 填到下面
#   npx wrangler d1 execute chd-snap --remote --file=migrations/0001_init.sql  # 建表
#   npx wrangler deploy                    # 首次部署
#   npx wrangler tail                      # 看 cron 日志
#   npx wrangler secret put SNAP_KEY       # 与站点 Worker 共享的内部密钥

name = "chd-snap"
main = "worker.mjs"
compatibility_date = "2026-10-01"

# account_id —— 本地部署前填回你自己的值（`npx wrangler whoami` 里能查到）。
# 仓库里刻意只留注释示例：这一串能唯一定位到 CF 账号，开源出去等于把门口牌号挂出去。
# account_id = "your-cloudflare-account-id"

# 🔴 D1 不需要支付方式，这是换掉 R2 的原因之一（R2 必须绑卡才能激活）。
#   建库命令 `npx wrangler d1 create chd-snap` 会输出：
#     database_id = "xxxx-xxxx-xxxx-xxxx"
#   把它填到下面，同时把 database_name 保持 chd-snap。
[[d1_databases]]
binding = "SNAP"
database_name = "chd-snap"
database_id = "your-d1-database-id"

[vars]
# 扫桩走站点现有的 /api/pile（凭证只有一份）
PILE_ORIGIN = "https://chd-charge.pages.dev"

[triggers]
# v2.99 起只剩**一条主时钟** `* * * * *`，分区怎么排全在 config.mjs：
#   AREA_CRON_MINUTES 给槽位（v3.33 起 7 个槽），AREA_CRON_GROUPS 给每槽跑哪些区
#   （一跳 ≤2 区且 ≤70 台）：
#       槽0 → 住宅 8 + 朝晖 36      槽1 → 北门 37 + 图书馆 8
#       槽2 → 20号楼 24 + 物业 12   槽3 → 北院 57 + 水院 3
#       槽4 → 5号公寓南 12 + 停车场 3
#       槽5 → 南院 3号楼南 6 + 3号楼东 6     （v3.33 新增）
#       槽6 → 南院 7号楼东 9 + 东门 8        （v3.33 新增）
#   统计另走 STATS_CRON_MINUTES = :04/:25/:46，落在槽 4 上、跳过该槽的分区组。
#
# 🔴 加区**不能**开新 cron（免费版 5 条已用满，第 6 条部署不上去）。
#    做法：往 AREA_CRON_GROUPS 末尾加一组 + 扩 AREA_CRON_MINUTES。
#    扩槽时必须同时把 MIN_INTERVAL_MIN 调到 ≥ 槽位数，否则同一槽
#    会在一个窗口里命中两次（重复扫，不报错）—— 见 config.mjs 那段注释。
#
# 🔴 统计那三分钟必须**落在同一个槽**、且是负载最轻的槽 —— 统计第一件事
#    就是读该槽的分区快照。撞在同一分钟的话谁先谁后不确定，统计点里
#    各区会来自两个不同时刻（静默的数据错误，不报错）。
#    :04/:25/:46 对 7 取模都是 4，正好都落在槽 4（15 台，最轻的一档）。
#
# 🔴 为什么是一小时三跳（2026-11-01）：分区 cron 5 分钟就自愈一次抖动，
#    而统计一小时只采一次样 —— 18:05 撞上一次 partial，这一小时就整格灰掉，
#    用户看到的是「偶尔某个地址某个时段没记录」。多采两跳 + 同小时合并
#    （core.appendStats），愈合后自动补上。
#
# 时段表在 config.mjs 里，cron 只是「每 5 分钟敲门一次」，跑不跑由表决定。
# v2.99：五条收敛成一条主时钟。免费版一个账号只有 5 条 cron trigger，
# 而第 9、10 个分区让四跳全满，再加一组就要第 6 条（部署不上去）。
# 分钟 → 任务改由 config.mjs 的 AREA_CRON_GROUPS / STATS_CRON_MINUTES 决定：
#   `分钟 % 7` 取槽（0..6），:04/:25/:46 跑统计。
# worker.mjs 仍兼容旧的 `N-59/5` 与 `9,29,49` 表达式（selftest / 灰度在用）。
crons = [
  "* * * * *",
]

[observability]
enabled = true
