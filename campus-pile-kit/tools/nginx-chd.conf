# 长安大学充电桩查询 —— 自建入口（IP 直连，无域名）
#
# 背景：这台机器的 ISP 按 Host 头做备案管控——Host 是纯 IP 放行，任何未备案
# 域名一律 403（80）或连接重置（443）。所以只能 http://IP 访问，不配域名、
# 不配证书。需要 WebCrypto 的功能（车牌登记等）在 HTTP 下会被浏览器限制。
#
# 由 tools/deploy_remote.py 上传到 /etc/nginx/sites-available/chd。
# 改这里 → 重跑脚本 → 自动 nginx -t + reload。

upstream cf_pages {
    # 本机到 pages.dev 的默认解析要 5~9 秒；换成这几个优选入口 IP 后 TTFB 0.6s。
    # anycast 对所有 zone 都有效，SNI 由下面的 proxy_ssl_name 负责。
    server 104.27.0.1:443 max_fails=2 fail_timeout=20s;
    server 104.20.1.1:443 max_fails=2 fail_timeout=20s;
    server 104.17.0.1:443 max_fails=2 fail_timeout=20s;
    server 104.21.0.1:443 max_fails=2 fail_timeout=20s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/chd;
    index index.html;
    charset utf-8;
    server_tokens off;

    # index.html 近 900KB 且全内联，gzip 是能不能「打开快」的决定性一环
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # ---------------- /api/* 反代到 Cloudflare Pages ----------------
    location /api/ {
        proxy_pass https://cf_pages;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host chd-charge.pages.dev;
        # 🔴 Worker 的 sameSiteRequest() 要求 Origin 严格等于 pages.dev 的 origin，
        #    不改这个头，所有 API 都会 403 bad_origin（GET 也要带，浏览器同源 GET 不发 Origin）。
        proxy_set_header Origin https://chd-charge.pages.dev;
        proxy_set_header Referer https://chd-charge.pages.dev/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name chd-charge.pages.dev;
        proxy_connect_timeout 6s;
        proxy_send_timeout 30s;
        proxy_read_timeout 45s;
    }

    # ---------------- 缓存头：照抄 Pages 的 _headers ----------------
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    # Pages 的 pretty URL：/guide 其实是 guide.html
    location = /guide {
        add_header Cache-Control "no-cache" always;
        try_files /guide.html =404;
    }
    location = /map-key.local.js {
        add_header Cache-Control "max-age=300" always;
    }
    location = /catalog.json {
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=86400" always;
    }
    location /ocr/ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
